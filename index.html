<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>好寶寶點數記錄 v2.0</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>好寶寶點數記錄</h1>
            <p>Supabase v2.0</p>
            <button class="logout-btn" id="logoutBtn" style="display:none;">登出</button>
        </div>

        <!-- 認證區 -->
        <div class="auth-section" id="authSection">
            <h2>請先登入或註冊</h2>
            <input type="email" id="emailInput" class="input-field" placeholder="電子郵件" required>
            <input type="password" id="passwordInput" class="input-field" placeholder="密碼 (至少6位)" required>
            <button class="btn btn-primary" id="signUpBtn">註冊</button>
            <button class="btn btn-secondary" id="signInBtn">登入</button>
            <p class="error-msg" id="authError"></p>
        </div>

        <!-- 家庭設定 -->
        <div class="family-setup-section" id="familySection" style="display:none;">
            <h2>設定你的家庭</h2>
            <button class="btn btn-primary" id="createFamilyBtn">建立一個新家庭</button>
            <p>或</p>
            <div class="input-group">
                <input type="text" id="familyCodeInput" class="input-field" placeholder="輸入家庭代碼...">
                <button class="btn btn-secondary" id="joinFamilyBtn">加入</button>
            </div>
        </div>

        <!-- 主頁面 -->
        <div class="content" id="mainPage" style="display:none;">
            <div class="family-code-display" id="familyCodeDisplay" style="display:none;">
                家庭代碼：<strong id="currentFamilyCode"></strong>
                <button id="copyCodeBtn">📋</button>
                <button class="logout-btn" style="position:static;" id="logoutBtn2">登出</button>
            </div>

            <!-- 新增小孩 -->
            <div class="section section-kid" id="addChildSection">
                <h2>👶 新增寶寶</h2>
                <div class="input-group">
                    <input type="text" id="childName" class="input-field" placeholder="輸入小孩姓名..." maxlength="20">
                    <button class="btn btn-primary" id="addChildBtn">新增</button>
                </div>
            </div>

            <!-- 小孩列表 -->
            <div class="children-list">
                <div class="list-header"><h2>🏆 寶寶列表</h2></div>
                <div id="childrenContainer">
                    <div class="empty-state"><div>🎈</div><p>還沒有新增任何小孩</p></div>
                </div>
            </div>
        </div>

        <!-- 小孩詳情頁 -->
        <div class="content" id="detailPage" style="display:none;">
            <button class="btn back-btn" id="backBtn">← 返回列表</button>

            <div class="detail-header">
                <h2 id="detailName">寶寶姓名</h2>
                <div class="detail-points" id="detailPoints">0</div>
                <p>目前點數</p>
                <div class="goal-progress" id="goalSection" style="display:none;">
                    <div class="goal-text" id="goalText"></div>
                    <div class="progress-bar"><div class="progress-fill" id="goalProgressBar"></div></div>
                    <div style="margin-top:10px;">
                        <button class="btn btn-success" id="redeemGoalBtn" style="display:none;">🎁 兌換</button>
                        <button class="btn btn-danger" id="deleteGoalBtn" style="display:none;">🗑️ 刪除</button>
                    </div>
                </div>
            </div>

            <!-- 設定目標 -->
            <div class="section section-goal" id="goalSectionInput" style="display:none;">
                <h3>🎯 設定目標</h3>
                <div class="input-group">
                    <input type="text" id="goalReason" class="input-field" placeholder="目標名稱..." maxlength="50">
                    <input type="number" id="goalPoints" class="input-field" placeholder="點數..." min="1" style="max-width:100px;">
                    <button class="btn btn-primary" id="setGoalBtn">設定</button>
                </div>
            </div>

            <!-- 新增記錄 -->
            <div class="section section-record" id="addRecordSection" style="display:none;">
                <h3>📝 新增記錄</h3>
                <div class="input-group">
                    <input type="text" id="recordReason" class="input-field" placeholder="加扣點原因..." list="reasonOptions" maxlength="50">
                    <datalist id="reasonOptions"></datalist>
                    <input type="number" id="recordPoints" class="input-field" placeholder="點數 (+/-)" style="max-width:120px;">
                    <button class="btn btn-primary" id="addRecordBtn">新增</button>
                </div>
                <div class="quick-points" id="quickPoints">
                    <button class="quick-btn" data-points="+1">+1</button>
                    <button class="quick-btn" data-points="+2">+2</button>
                    <button class="quick-btn" data-points="+3">+3</button>
                    <button class="quick-btn" data-points="+5">+5</button>
                    <button class="quick-btn" data-points="+10">+10</button>
                    <button class="quick-btn" data-points="-1">-1</button>
                    <button class="quick-btn" data-points="-2">-2</button>
                    <button class="quick-btn" data-points="-3">-3</button>
                    <button class="quick-btn" data-points="-5">-5</button>
                    <button class="quick-btn" data-points="-10">-10</button>
                </div>
            </div>

            <!-- 常用原因 -->
            <div class="reason-tags" id="reasonTagsSection" style="display:none;">
                <h3>⚡ 常用原因</h3>
                <ul id="commonReasonsList"></ul>
            </div>

            <!-- 點數記錄 -->
            <div class="records-list">
                <div class="list-header"><h2>📋 點數記錄</h2></div>
                <div id="recordsContainer">
                    <div class="empty-state"><div>📝</div><p>還沒有任何記錄</p></div>
                </div>
            </div>

            <!-- 獎勵管理 -->
            <div class="section section-reward" id="rewardSection" style="display:none;">
                <h3>🎁 管理獎勵</h3>
                <div class="input-group">
                    <input type="text" id="rewardName" class="input-field" placeholder="獎勵名稱..." maxlength="50">
                    <input type="number" id="rewardCost" class="input-field" placeholder="所需點數..." min="1" style="max-width:120px;">
                    <button class="btn btn-primary" id="addRewardBtn">新增</button>
                    <button class="btn btn-secondary" id="cancelRewardBtn" style="display:none;">取消</button>
                </div>
            </div>

            <!-- 獎勵列表 -->
            <div class="rewards-list">
                <div class="list-header"><h2>🏅 獎勵清單</h2></div>
                <div id="rewardsContainer"></div>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
